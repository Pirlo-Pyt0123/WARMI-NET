version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: warmi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: warmi_root_2026
      MYSQL_DATABASE: warmi_net
      MYSQL_USER: warmi_user
      MYSQL_PASSWORD: warmi_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - warmi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: warmi_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST=mysql
      DB_PORT=3306
      DB_USER=warmi_user
      DB_PASSWORD=warmi_pass_2026
      DB_NAME=warmi_net
      JWT_SECRET=warmi_super_secret_key_change_in_production_2026
      NODE_ENV=development
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - warmi_network

volumes:
  mysql_data:

networks:
  warmi_network:
    driver: bridge
